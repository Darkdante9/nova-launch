name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "event-schemas/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "event-schemas/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Verify generated event types are in sync with event-schemas/
        run: |
          npm run generate:event-types
          git diff --exit-code -- ../event-schemas/generated || {
            echo "::error::event-schemas/generated/ is out of date. Run 'npm run generate:event-types' from backend/ and commit the result.";
            exit 1;
          }

      - name: Run tests
        run: npm test -- --run --coverage || true

      - name: Build
        run: npm run build
